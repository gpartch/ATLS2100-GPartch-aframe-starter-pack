<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="chair" src="assets/chair/chair.gltf"></a-asset-item>
        <a-asset-item id="umbrella" src="assets/umbrella/scene.gltf"></a-asset-item>
        <img id="background" src="assets/background.jpg">
      </a-assets>
        <a-entity gltf-model="#chair"
          position="0 1.4 -1"
          scale="0.01 0.01 0.01"></a-entity>
        <a-entity gltf-model="#umbrella"
          position="0 -1 -4"
          scale="0.015 0.015 0.015"></a-entity>
      <!-- <a-entity environment="preset: egypt; dressingAmount: 500"></a-entity> -->
      <a-sky src="#background"></a-sky>
      <!-- <a-entity camera look-controls wasd-controls="acceleration: 200" position="0 1.6 0"></a-entity> -->
    </a-scene>
  </body>
</html>
