<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"> </script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@1.1.4/dist/aframe-particle-system-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity particle-system="
      particleCount: 500;
      maxAge: 8;
      positionSpread: 8 4 8;
      texture: url(assets/aspen-leaf.png);
      velocityValue: 0 -.6 0;
      velocitySpread: .75 0 .75;
      accelerationValue: 0 0 0;
      accelerationSpread: 0 0 0;
      color: #FFFFFF;
      size: .4;
    " position="0 5 0"></a-entity>
      <a-sky src="assets/background.jpg"></a-sky>
    </a-scene>
  </body>
</html>
