<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"> </script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@1.1.4/dist/aframe-particle-system-component.min.js"></script>

    <a-asset-item id="aspen_6" src="assets/quaking_aspen_6.glb"></a-asset-item>
    <a-asset-item id="aspen_5" src="assets/quaking_aspen_5.glb"></a-asset-item>
    <a-asset-item id="aspen_4" src="assets/quaking_aspen_4.glb"></a-asset-item>
    <a-asset-item id="aspen_3" src="assets/quaking_aspen_3.glb"></a-asset-item>
    <a-asset-item id="aspen_2" src="assets/quaking_aspen_2.glb"></a-asset-item>
    <a-asset-item id="aspen_1" src="assets/quaking_aspen_1.glb"></a-asset-item>

    <a-asset-item id="picnic" src="assets/low_poly_picnic_asset_pack.glb"></a-asset-item>
  </head>
  <body>
    <a-scene>
      <a-camera wasd-controls-enabled="false"></a-camera>
        <!-- <a-entity id="rig" position="2 1.6 -1" rotation="0 90 0">
          <a-entity id="camera" camera look-controls wasd-controls></a-entity>
        </a-entity> -->
      <a-entity particle-system="
      particleCount: 800;
      maxAge: 8;
      positionSpread: 20 10 20;
      texture: url(assets/aspen-leaf.png);
      velocityValue: 0 -.6 0;
      velocitySpread: .75 0 .75;
      accelerationValue: 0 0 0;
      accelerationSpread: 0 0 0;
      color: #FFFFFF;
      size: .6;
    " position="0 5 0"></a-entity>

      <a-entity gltf-model="#aspen_6"
          position="4 -.5 6"
          scale=".5 .5 .5"></a-entity>
        <a-entity gltf-model="#aspen_5"
        position="-6 -10 21"
        scale="1 1 1"></a-entity>
        <a-entity gltf-model="#aspen_4"
        position="8 -4 -5"
        scale="1 1 1"></a-entity>
        <a-entity gltf-model="#aspen_4"
        position="8 -4 -5"
        scale="1 1 1"></a-entity>
        <a-entity gltf-model="#aspen_3"
        position="-15 -3.5 -1"
        scale="1 1 1"></a-entity>
        <a-entity gltf-model="#aspen_6"
          position="-1 -.5 -5"
          scale=".5 .5 .5" rotation="0 -60 0"></a-entity>
        <a-entity gltf-model="#aspen_4"
        position="-15 -5.5 8"
        scale=".75 .75 .75"></a-entity>
        <a-entity gltf-model="#aspen_2"
        position="-7 -2 -16"
        scale=".75 .75 .75"></a-entity>
        <a-entity gltf-model="#aspen_2"
        position="10 -2 -3"
        scale=".5 .5 .5" rotation="0 90 0"></a-entity>
        
         <!-- <a-entity gltf-model="#picnic"
        position="2 -1 3"
        scale=".02 .02 .02"></a-entity> -->

        <a-entity light="type: directional; color: #FCFCD2; intensity: 2" position="1 1 0"></a-entity>
        <a-entity light="type: ambient; color: white; intensity: 1"></a-entity>

      <a-sky src="assets/background.jpg"></a-sky>
    </a-scene>
  </body>
</html>
